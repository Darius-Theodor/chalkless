<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chalkless</title>
<style>
  :root { color-scheme: light dark;
          --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#5f636a; --line:#e3e1dc; --accent:#2f6f5e;
          --warn:#8a5208; --err:#a33; --ok:#2f6f5e; --soft:#eef3f1; --link:#1d5fa8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181a1b; --card:#222527; --ink:#e8e6e3; --muted:#a4a8ae; --line:#3a3e42; --accent:#7cc4ad;
            --warn:#e0a24a; --err:#e88; --ok:#7cc4ad; --soft:#25302d; --link:#8cbcf0; }
  }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:baseline; gap:4px 12px; padding:12px 14px 6px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  #ctx { min-width:0; overflow-wrap:anywhere; }
  #live { margin-left:auto; font-size:13px; color:var(--muted); }
  body[data-conn="weg"] #live { color:var(--warn); font-weight:600; }
  nav { display:flex; gap:4px; padding:0 10px 8px; overflow-x:auto; white-space:nowrap; scrollbar-width:thin; max-width:100%; }
  nav:empty { display:none; }
  nav a { display:inline-flex; align-items:center; min-height:32px; padding:4px 12px; border-radius:8px; color:var(--ink);
          text-decoration:none; font-size:14px; flex:0 0 auto; }
  nav a:hover { text-decoration:underline; }
  nav a[aria-current="page"] { background:var(--card); box-shadow:0 0 0 1px var(--line); font-weight:600; }
  main { padding:0 14px 30px; display:grid; gap:12px; min-width:0; }
  main > div:empty { display:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; overflow-wrap:anywhere; }
  .card h2 { font-size:15px; margin:0 0 8px; }
  .card h3 { font-size:14px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
  .muted { color:var(--muted); }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(260px, 100%), 1fr)); }
  .pill { display:inline-block; font-size:13px; padding:1px 8px; border-radius:99px; background:var(--soft); color:var(--accent); white-space:nowrap; }
  .pill.warn { color:var(--warn); background:transparent; box-shadow:inset 0 0 0 1px var(--warn); }
  .pill.err { color:var(--err); background:transparent; box-shadow:inset 0 0 0 1px var(--err); }
  .pill.busy { color:#fff; background:var(--accent); }
  @media (prefers-color-scheme: dark) { .pill.busy { color:#111; } }
  @media (prefers-reduced-motion: no-preference) {
    .pill.busy { animation:pulse 1.6s ease-in-out 3; }
    @keyframes pulse { 50% { opacity:.6; } }
  }
  ul.plain { list-style:none; margin:0; padding:0; }
  ul.plain li { padding:6px 0; border-top:1px solid var(--line); display:flex; gap:4px 8px; align-items:baseline; flex-wrap:wrap; min-width:0; }
  ul.plain li:first-child { border-top:0; }
  a { color:var(--link); }
  a.doc, a.ex { display:inline-block; min-height:24px; line-height:24px; color:var(--link); text-decoration:underline;
                text-underline-offset:2px; font-weight:500; }
  a.ex { font-size:13px; padding:0 6px; border:1px solid var(--line); border-radius:6px; text-decoration:none; }
  a.ex:hover, a.ex:focus-visible { text-decoration:underline; }
  .say { font-style:italic; quotes:"\201E" "\201C"; }
  html[lang="en"] .say { quotes:"\201C" "\201D"; }
  .say::before { content:open-quote; } .say::after { content:close-quote; }
  ul.plain li.say { display:block; }
  .area-head { display:flex; gap:6px 10px; align-items:baseline; flex-wrap:wrap; }
  .area-head h2 { margin:0; }
  .kv { display:grid; grid-template-columns:max-content minmax(0, 1fr); gap:2px 12px; font-size:14px; margin:8px 0; }
  .kv div:nth-child(odd) { color:var(--muted); }
  .hint { margin:8px 0 0; padding:8px 10px; border-left:3px solid var(--warn); background:var(--soft); font-size:14px; }
  .preview iframe { display:block; width:100%; height:72vh; min-height:320px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .preview .tools { display:flex; gap:6px 12px; flex-wrap:wrap; align-items:center; margin:0 0 8px; }
  button.lnk { font:inherit; font-size:14px; min-height:28px; padding:2px 10px; border:1px solid var(--line); border-radius:6px;
               background:var(--card); color:var(--link); cursor:pointer; }
  .small { font-size:13px; }
  table.t { border-collapse:collapse; width:100%; font-size:14px; }
  table.t td { text-align:left; padding:4px 6px; border-top:1px solid var(--line); vertical-align:top; }
  .empty { padding:22px 16px; text-align:center; }
  .empty .say { font-size:17px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  details summary { cursor:pointer; min-height:24px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
</style>
</head>

    emptyArea: ["Nothing here yet. For example, say in the chat:", ""], emptyAreaSay: n => `Plan a lesson for ${n} on …`,

    keys: { schuljahr: "School year", sequenz: "Unit", naechstes: "Next", letztes: "Last", offen: "Open" },

    ctxInbox: "Have a look at the new files in the inbox.", ctxSeq: n => `${n}: Plan a unit on … with … lessons from …`,

    ctxCheck: a => `Let's do “${a}”.`,
    groups: [

      ["Materials", ["Worksheet with two levels of support and an answer sheet for yesterday's lesson.", "Slides for the lesson “…”.", "Picture cards for …, portrait, white background.", "I need three ideas for starting …"]],

let S = null, L = TX.de, LANG = "de", FORMAL = false, etag = null, conn = "start";
let view = decodeURIComponent(location.hash.slice(1)) || "heute";
let pageView = null;               // null = automatic (reading view below 860 px), true/false = chosen
const last = {};                   // last HTML per container: only changed containers are replaced
let lastActs = null;
const tr = (k, ...a) => { const v = L[k] ?? TX.de[k]; if (typeof v === "function") return v(...a);
  if (Array.isArray(v)) return (FORMAL && v[1]) ? v[1] : v[0]; return v; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Without a server (the page was written into the folder by server.py --datei) files are opened by relative path.
const STATIC = window.CHALKLESS_STATIC || null;
const fileUrl = p => (STATIC ? "" : "/datei/") + p.split("/").map(encodeURIComponent).join("/");
const pill = (t, cls="") => t ? `<span class="pill ${cls}">${esc(t)}</span>` : "";
const fmtDate = d => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); if (!m) return esc(d || "");
  return esc(new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(LANG === "de" ? "de-DE" : "en-GB", { day:"numeric", month:"short", year:"numeric" }));
};
const words = s => esc(String(s || "").replace(/-/g, " "));
const typ1 = t => (L.typ1 || {})[t] || t;
function areaName(a) {
  const i = a.info || {};
  const k = i.klasse || i["klasse/kurs"] || "", f = i.fach || "";
  return (k || f) ? `${k} ${f}`.trim() : a.id.replace(/-/g, " ");
}
const ACTCLS = { "wird erstellt":"busy", fertig:"", unterbrochen:"warn", leer:"", defekt:"err" };
const actPill = a => pill(L.act[a.aktivitaet] || a.aktivitaet, ACTCLS[a.aktivitaet] || "");
const q = t => LANG === "de" ? `„${t}“` : `“${t}”`;
function workText(a) {
  const x = a.aktiv || {};
  const what = [esc(typ1(x.typ)), x.slug ? q(words(x.slug)) : ""].filter(Boolean).join(" ");
  return { what: what || "…", since: x.zeit ? (x.datum && x.datum !== S.heute ? `${fmtDate(x.datum)}, ${x.zeit}` : x.zeit) : "" };
}

// ---------------------------------------------------------------- loading, connection
function setConn(c) {
  if (c === conn) return;
  const before = conn; conn = c; document.body.dataset.conn = c;
  const el = document.getElementById("live");
  el.textContent = c === "weg" ? tr("gone") : (before === "weg" ? tr("back") : tr("live"));
}
async function load() {
  let r;
  try {
    r = await fetch("/api/state", { cache:"no-cache", headers: etag ? { "If-None-Match": etag } : {} });
  } catch (e) { setConn("weg"); return; }
  if (r.status === 304) { setConn("ok"); return; }
  if (!r.ok) { setConn("weg"); return; }
  etag = r.headers.get("ETag");
  take(await r.json());
  setConn("ok");
}
function take(st) {
  S = st;
  const code = (S.sprache && S.sprache.code) || "de";
  L = TX[code] || TX.de; LANG = TX[code] ? code : "de"; FORMAL = !!(S.sprache && S.sprache.formell);
  document.documentElement.lang = LANG;
  document.getElementById("nav").setAttribute("aria-label", tr("nav"));
  announceChanges();
  render();
}
// Without a server: the state is built into the page; the data file next to it is read again every few seconds.
let staticSeen = "";
window.chalklessStand = st => {
  const j = JSON.stringify(st); if (j === staticSeen) return; staticSeen = j;
  const n = new Date(), p = x => String(x).padStart(2, "0");
  st.heute = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
  take(st);
  conn = "ok"; document.body.dataset.conn = "ok"; document.getElementById("live").textContent = tr("liveFile");
};
function pollStatic() {
  const old = document.getElementById("stand-js"); if (old) old.remove();
  const s = document.createElement("script"); s.id = "stand-js"; s.src = STATIC.daten + "?t=" + Date.now();
  document.body.appendChild(s);
}
function announceChanges() {
  const now = Object.fromEntries(S.bereiche.map(a => [a.id, a.aktivitaet]));
  if (lastActs) {
    const msgs = S.bereiche.filter(a => lastActs[a.id] && lastActs[a.id] !== a.aktivitaet).map(a => `${areaName(a)}: ${L.act[a.aktivitaet] || a.aktivitaet}`);
    if (msgs.length) document.getElementById("announce").textContent = msgs.join(". ");
  }
  lastActs = now;
}
let es = null;
function connect() {
  try { es = new EventSource("/api/events"); } catch (e) { return; }
  es.addEventListener("geaendert", load);
  es.addEventListener("hallo", load);
  es.onerror = () => {
    setConn("weg");
    if (es.readyState === 2) { es.close(); setTimeout(connect, 3000); }
  };
}

// ---------------------------------------------------------------- rendering (only changed parts)
function put(id, htmlText) {
  if (last[id] === htmlText) return;
  const el = document.getElementById(id);
  const f = document.activeElement && el.contains(document.activeElement) ? document.activeElement.dataset.k : null;
  el.innerHTML = htmlText; last[id] = htmlText;
  if (f) { const again = el.querySelector(`[data-k="${CSS.escape(f)}"]`); if (again) again.focus(); }
}
function render() {
  if (!S) return;
  document.getElementById("ctx").textContent = S.eingerichtet
    ? [S.rahmen.schulform, S.rahmen.region || S.rahmen.land, S.rahmen.status_begriff].filter(Boolean).join(" · ") : "";
  put("banner", banner());
  if (!S.eingerichtet) { put("nav", ""); put("top", notSetUp()); put("preview", ""); put("rest", ""); return; }
  put("nav", nav());
  if (view.startsWith("b:")) { const v = areaView(view.slice(2)); put("top", v.top); put("preview", v.prev); put("rest", v.rest); }
  else { put("preview", ""); put("rest", "");
    put("top", view === "sagen" ? sayView() : view === "gemerkt" ? prefsView() : todayView()); }
}
function nav() {
  const items = [["heute", tr("today")], ...S.bereiche.map(a => ["b:"+a.id, areaName(a)]), ["gemerkt", tr("prefs")], ["sagen", tr("say")]];
  const cur = view.startsWith("b:") ? "b:" + view.slice(2).split("/")[0] : (["sagen","gemerkt"].includes(view) ? view : "heute");
  return items.map(([k,l]) => `<a href="#${esc(k)}" data-k="nav-${esc(k)}"${cur === k ? ' aria-current="page"' : ""}>${esc(l)}</a>`).join("");
}
function banner() {
  if (!S.defekt || !S.defekt.length) return "";
  return `<div class="card"><h2>${esc(tr("damaged", S.defekt.length))}</h2><ul class="plain">${S.defekt.map(p => `<li>${esc(p.split("/").slice(p.endsWith("STAND.md") ? -2 : -1).join("/"))}</li>`).join("")}</ul>
    <p class="small">${esc(tr("damagedSay"))}</p></div>`;
}
function notSetUp() {
  const inc = S.eingang.length ? `<p class="muted small">${esc(tr("inbox", S.eingang.length))}</p>` : "";
  const begun = S.profil_da;
  return `<div class="card empty"><h2>${esc(tr("welcome"))}</h2>
    <p>${esc(tr("fresh"))}</p>
    <p class="muted">${esc(begun ? tr("setupBegun") : tr("sayChat"))}</p>
    <p class="say">${esc(begun ? tr("resumeSetup") : tr("startSetup"))}</p>
    ${begun ? "" : `<p class="muted small">${esc(tr("inboxHint"))}</p>`}${inc}</div>`;
}
function interruptedHint(a) {
  const w = workText(a);
  return `<p class="hint">${esc(tr("interrupted"))}: ${w.what}${w.since ? ` (${esc(tr("begun", w.since))})` : ""}. ${esc(tr("interruptedSay"))}</p>`;
}
function todayView() {
  const out = [];
  const busy = S.bereiche.filter(a => ["wird erstellt", "unterbrochen", "defekt"].includes(a.aktivitaet));
  if (busy.length) out.push(`<div class="card"><h2>${esc(tr("now"))}</h2><ul class="plain">${busy.map(a => {
    const w = workText(a);
    const txt = a.aktivitaet === "wird erstellt" ? `<span>${esc(tr("working"))} ${w.what}${w.since ? ` (${esc(tr("since", w.since))})` : ""}</span>`
      : a.aktivitaet === "unterbrochen" ? interruptedHint(a) : `<span class="small">${esc(tr("damagedStand"))}</span>`;
    return `<li>${actPill(a)} <a class="doc" data-k="now-${esc(a.id)}" href="#b:${esc(a.id)}">${esc(areaName(a))}</a> ${txt}</li>`; }).join("")}</ul></div>`);
  const due = [], later = [], someday = [];
  if (S.eingang.length) due.push(["", esc(tr("newInbox", S.eingang.join(", "))), ""]);
  for (const c of S.checks) {
    const label = (L.checkLabel || {})[c.anlass] || c.anlass;
    const row = [c.datum, esc(label) + (c.setup ? ` – <span class="say">${esc(tr("resumeSetup"))}</span>` : ""), ""];
    (c.wann === "faellig" ? due : c.wann === "spaeter" ? later : someday).push(row);
  }
  for (const t of S.termine) {
    const row = [t.datum, `${esc(t.art || tr("termin"))} ${esc(t.thema || "")}`, t.bereich || ""];
    const d = new Date(t.datum), n = new Date(S.heute);
    ((d - n) / 864e5 <= 14 ? due : later).push(row);
  }
  if (S.offen) someday.push(["", esc(tr("queue", S.offen)), ""]);
  const li = rows => `<ul class="plain">${rows.sort((a,b) => a[0].localeCompare(b[0])).map(([d,t,w]) =>
    `<li>${d ? `<b>${fmtDate(d)}</b>` : ""} <span>${t}</span> ${w ? `<span class="muted small">${esc(w)}</span>` : ""}</li>`).join("")}</ul>`;
  out.push(`<div class="card"><h2>${esc(tr("next"))}</h2>${due.length ? li(due) : `<p class="muted">${esc(tr("nothingDue"))}</p>`}
    ${later.length ? `<h3>${esc(tr("later"))}</h3>${li(later)}` : ""}${someday.length ? `<h3>${esc(tr("someday"))}</h3>${li(someday)}` : ""}</div>`);
  out.push(`<div class="grid">${S.bereiche.map(a => {
    const st = a.stand || {}, lastDoc = a.dokumente[0];
    return `<div class="card"><div class="area-head"><h2><a class="doc" data-k="area-${esc(a.id)}" href="#b:${esc(a.id)}">${esc(areaName(a))}</a></h2>${actPill(a)}</div>
      <div class="kv">${st.sequenz ? `<div>${esc(L.keys.sequenz)}</div><div>${esc(st.sequenz)}</div>` : ""}
      ${st.naechstes ? `<div>${esc(L.keys.naechstes)}</div><div>${esc(st.naechstes)}</div>` : ""}
      ${lastDoc ? `<div>${esc(L.keys.letztes)}</div><div><a class="doc" data-k="last-${esc(lastDoc.pfad)}" href="#b:${esc(a.id)}/${esc(lastDoc.pfad)}">${esc(lastDoc.titel)}</a></div>` : ""}
      ${st.offen ? `<div>${esc(L.keys.offen)}</div><div>${esc(st.offen)}</div>` : ""}</div>
      <span class="muted small">${esc(a.dokumente.length ? tr("docs", a.dokumente.length) : tr("noDocsYet"))}</span></div>`; }).join("") ||
    `<div class="card muted">${esc(tr("noAreas"))}</div>`}</div>`);
  const b = S.paket.bausteine;
  if (S.paket.id && b.length) {
    const open = b.filter(x => x.status !== "geprüft");
    out.push(`<div class="card"><h2>${esc(tr("sources"))}</h2><p class="small">${esc(tr("sourcesSum", b.length - open.length, b.length))}</p>
      ${open.length ? `<table class="t">${open.map(x => `<tr><td>${esc(x.baustein)}</td><td>${pill((L.srcState || {})[x.status] || x.status, "warn")}</td></tr>`).join("")}</table>` : ""}</div>`);
  }
  return out.join("");
}
function docRow(a, d) {
  const st = (L.status || {})[d.status] || d.status || "";
  const ex = d.exporte.map(e => {
    const ext = e.split(".").pop().toLowerCase();
    const showable = ["pdf","png","jpg","jpeg","webp"].includes(ext);
    return showable ? `<a class="ex" data-k="ex-${esc(e)}" href="#b:${esc(a.id)}/${esc(e)}">${esc(ext.toUpperCase())}</a>`
                    : `<a class="ex" data-k="ex-${esc(e)}" href="${fileUrl(e)}" download>${esc(ext.toUpperCase())}</a>`; }).join(" ");
  return `<li><span class="muted small">${fmtDate(d.datum)}</span> <a class="doc" data-k="doc-${esc(d.pfad)}" href="#b:${esc(a.id)}/${esc(d.pfad)}">${esc(d.titel)}</a>
    ${pill(st)} ${d.variante ? pill(d.variante) : ""} ${d.defekt ? pill(tr("incomplete"), "err") : ""} ${d.ohne_html ? pill(tr("noHtml"), "warn") : ""} ${ex}</li>`;
}
function areaView(spec) {
  const [id, ...rest] = spec.split("/");
  const a = S.bereiche.find(x => x.id === id);
  if (!a) return { top: `<div class="card muted">${esc(tr("areaMissing"))}</div>`, prev: "", rest: "" };
  const sel = rest.join("/");
  const st = a.stand || {};
  const ORDER = ["schuljahr", "sequenz", "naechstes", "letztes", "offen"];
  const stWord = v => v.replace(/·\s*(entwurf|geprüft|verwendet)\s*$/, (m, x) => "· " + ((L.status || {})[x] || x));
  const kv = Object.entries(st).sort(([a],[b]) => ((ORDER.indexOf(a)+99)%99) - ((ORDER.indexOf(b)+99)%99)).map(([k,v]) => [k, stWord(v)]).map(([k,v]) => `<div>${esc((L.keys || {})[k] || k.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()))}</div><div>${esc(v)}</div>`).join("");
  const w = workText(a);
  const state = a.aktivitaet === "unterbrochen" ? interruptedHint(a)
    : a.aktivitaet === "wird erstellt" ? `<p class="small">${esc(tr("working"))} ${w.what}${w.since ? ` (${esc(tr("since", w.since))})` : ""}</p>`
    : a.aktivitaet === "defekt" ? `<p class="hint">${esc(tr("damagedStand"))}</p>` : "";
  const spur = a.spur.length ? `<details class="small"><summary class="muted" data-k="spur-${esc(a.id)}">${esc(tr("history"))}</summary><ul class="plain">${a.spur.slice().reverse().map(e =>
    `<li class="muted">${e.datum ? `${fmtDate(e.datum)}${e.zeit ? ", " + esc(e.zeit) : ""} – ` : ""}${esc(e.art === "start" ? tr("started") : e.art === "fertig" ? tr("finished") : e.art)}${e.text ? ": " + words(e.text) : ""}</li>`).join("")}</ul></details>` : "";
  const top = `<div class="card"><div class="area-head"><h2>${esc(areaName(a))}</h2>${actPill(a)}</div>${kv ? `<div class="kv">${kv}</div>` : ""}${state}${spur}</div>`;
  let prev = "";
  if (sel) {
    const doc = a.dokumente.find(d => d.pfad === sel || d.exporte.includes(sel));
    const isHtml = /\.html?$/i.test(sel), isPdf = /\.pdf$/i.test(sel);
    const reading = !STATIC && isHtml && (pageView === null ? window.innerWidth < 860 : !pageView);
    const src = fileUrl(sel) + (reading ? "?ansicht=lesen" : "") + (doc ? (reading ? "&" : "?") + "v=" + doc.mtime : "");
    const toggle = isHtml && !STATIC ? `<button class="lnk" type="button" data-k="toggle" onclick="pageView = ${reading}; render()">${esc(reading ? tr("pageView") : tr("readView"))}</button>` : "";
    prev = `<div class="card preview"><div class="area-head"><h2>${esc(tr("preview"))}: ${esc(doc ? doc.titel : sel.split("/").pop())}</h2></div>
      <div class="tools"><a class="doc small" data-k="close" href="#b:${esc(a.id)}">${esc(tr("close"))}</a>${toggle}
      <a class="doc small" data-k="own" href="${fileUrl(sel)}" target="_blank" rel="noopener">${esc(tr("own"))}</a></div>
      ${isPdf ? `<p class="muted small">${esc(tr("pdfHint"))}</p>` : ""}
      <iframe src="${esc(src)}" title="${esc(tr("preview"))}"></iframe></div>`;
  }
  const groups = {};
  for (const d of a.dokumente) (groups[d.typ] = groups[d.typ] || []).push(d);
  const order = Object.keys(groups).sort((x,y) => ((Object.keys(L.typ).indexOf(x)+99)%99) - ((Object.keys(L.typ).indexOf(y)+99)%99));
  const list = order.map(t => `<div class="card"><h2>${esc(L.typ[t] || t)}</h2><ul class="plain">${groups[t].map(d => docRow(a, d)).join("")}</ul></div>`).join("");
  return { top, prev, rest: list || `<div class="card empty"><p class="muted">${esc(tr("emptyArea"))}</p><p class="say">${esc(tr("emptyAreaSay", areaName(a)))}</p></div>` };
}
function prefsView() {
  const p = S.vorlieben || [];
  const line = x => `<li>${esc(x.regel)}<span class="muted small">${esc(L.scope(x.geltung))} · ${fmtDate(x.datum)}</span></li>`;
  const on = p.filter(x => x.zustand === "bestätigt"), old = p.filter(x => x.zustand === "überholt"), pend = p.filter(x => x.zustand === "vermutet");
  return `<div class="card"><h2>${esc(tr("prefsTitle"))}</h2>${on.length ? `<ul class="plain">${on.map(line).join("")}</ul><p class="muted small">${esc(tr("prefsHow"))}</p>` : `<p class="muted">${esc(tr("prefsNone"))}</p>`}
    ${pend.length ? `<h3>${esc(tr("prefsPending"))}</h3><ul class="plain">${pend.map(line).join("")}</ul>` : ""}
    ${old.length ? `<details><summary class="muted small" data-k="prefs-old">${esc(tr("prefsOld"))} (${old.length})</summary><ul class="plain">${old.map(line).join("")}</ul></details>` : ""}</div>`;
}
function sayView() {
  const s = [];
  const add = (title, lines) => s.push(`<div class="card"><h2>${esc(title)}</h2><ul class="plain">${lines.map(l => `<li class="say">${esc(l)}</li>`).join("")}</ul></div>`);
  const ctx = [];
  if (S.eingang.length) ctx.push(L.ctxInbox);
  for (const a of S.bereiche) {
    const n = areaName(a), has = t => a.dokumente.some(d => d.typ === t);
    if (!a.dokumente.length) ctx.push(L.ctxSeq(n));
    else if (has("sequenz") && a.stand && a.stand.naechstes) ctx.push(L.ctxNext(n));
    if (!has("jahresplan")) ctx.push(L.ctxYear(n));
  }
  for (const c of S.checks) if (c.wann === "faellig" && !c.setup) ctx.push(L.ctxCheck(c.anlass));
  if (ctx.length) add(tr("fit"), ctx.slice(0, 8));
  for (const [title, lines] of L.groups) add(title, lines);
  return `<p class="muted small">${esc(tr("sayIntro"))}</p><div class="grid">${s.join("")}</div>`;
}

window.addEventListener("hashchange", () => { view = decodeURIComponent(location.hash.slice(1)) || "heute"; render(); });
let wasNarrow = window.innerWidth < 860;
window.addEventListener("resize", () => { const n = window.innerWidth < 860; if (n !== wasNarrow) { wasNarrow = n; if (pageView === null) render(); } });
document.getElementById("live").textContent = TX.de.connecting;
if (STATIC) { window.chalklessStand(window.CHALKLESS_STATE); setInterval(pollStatic, 4000); } else { load(); connect(); }
setInterval(load, 15000);  // fallback if events are blocked; ETag: unchanged state costs no re-render
</script>
</body>
</html>
